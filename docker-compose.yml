services:
  sacred-focus:
    image: sacred-focus:${APP_VERSION:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-latest}
        VCS_REF: ${VCS_REF:-unknown}
    container_name: sacred-focus
    restart: unless-stopped
    # 多项目共用宿主机时的运行时资源边界；可在 .env 中按服务器规格调整。
    # 512 MB 足以覆盖当前 Node + SQLite 的常规负载，保留余量给宿主机和其他服务。
    mem_limit: ${APP_MEMORY_LIMIT:-512m}
    mem_reservation: ${APP_MEMORY_RESERVATION:-128m}
    memswap_limit: ${APP_MEMORY_SWAP_LIMIT:-512m}
    cpus: ${APP_CPU_LIMIT:-0.75}
    pids_limit: ${APP_PIDS_LIMIT:-200}
    ports:
      # 默认仅供宿主机本地维护；生产公网流量必须经过 docker-compose.nginx.yml。
      - "127.0.0.1:${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      # 同时作为 /api/health 的可追溯交付版本；镜像标签与应用版本保持一致。
      APP_VERSION: ${APP_VERSION:-latest}
      PORT: "3000"
      HOST: 0.0.0.0
      DATA_DIR: /app/data
      TZ: ${TZ:-Asia/Shanghai}
      # V8 堆小于容器硬上限，为原生 SQLite 模块和系统内存预留空间。
      NODE_OPTIONS: "--max-old-space-size=${NODE_HEAP_LIMIT_MB:-384}"
      # 生产密钥必须由 .env 提供；Compose 在启动前失败，不允许以空值运行。
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      # 默认不信任转发头；Nginx 组合编排会显式覆盖为 1。
      TRUST_PROXY: "false"
      TRUSTED_IPS: ${TRUSTED_IPS:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    volumes:
      # SQLite WAL 数据库与备份文件持久化挂载
      - ${HOST_DATA_DIR:-./data}:/app/data
    logging:
      # 限制容器日志体积，避免虚拟机磁盘被长期日志撑满
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
