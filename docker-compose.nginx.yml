# ========================================================
# Sacred Focus 企业级网关反向代理组合编排 (包含 Nginx)
# 启动方式: docker compose -f docker-compose.yml -f docker-compose.nginx.yml up -d
# ========================================================

services:
  sacred-focus:
    # 隐藏直接暴露的 3000 端口，由内部网络流通
    ports: !override []
    environment:
      # 应用容器仅由本 Compose 文件定义的单层 Nginx 代理访问；
      # 与 Nginx 的 X-Forwarded-* 头配对，禁止在基础 Compose 中开启。
      TRUST_PROXY: "1"
    networks:
      - sacred-network

  nginx:
    image: nginx:1.27-alpine
    container_name: sacred-focus-gateway
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      # 证书目录必须位于仓库外，通过 .env 中的 NGINX_SSL_DIR 指定。
      - ${NGINX_SSL_DIR:?Set NGINX_SSL_DIR to the directory containing server.crt and server.key}:/etc/nginx/ssl:ro
    depends_on:
      sacred-focus:
        condition: service_healthy
    networks:
      - sacred-network
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

networks:
  sacred-network:
    driver: bridge
