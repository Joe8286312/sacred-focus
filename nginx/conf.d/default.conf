# ========================================================
# Sacred Focus Nginx 网关安全反向代理配置
# 包含 HTTP -> HTTPS 自动重定向与 TLS 加密代理 (P1-004)
# ========================================================

# 仅在客户端实际请求升级时传递 Upgrade；普通 HTTP 请求不得伪装为长连接升级。
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# 1. HTTP 流量监听 (强制跳转 HTTPS，健康检查放行)
server {
    listen 80;
    server_name _;
    server_tokens off;

    # 容器层与内网健康探测豁免重定向
    location /api/health {
        proxy_pass http://sacred-focus:3000/api/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto http;
        proxy_connect_timeout 5s;
        proxy_read_timeout 5s;
    }

    # 其余所有 HTTP 访问强制升级为 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS 安全传输监听 (支持 Secure Cookie 与全链路加密)
server {
    listen 443 ssl;
    server_name _;
    server_tokens off;

    # SSL 证书配置 (挂载自 ./nginx/ssl 目录)
    ssl_certificate /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;

    # TLS 协议加固与密码套件限制
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Gzip 高性能压缩
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # 与 Express JSON body 限制保持一致，避免网关放行而上游拒绝的歧义错误。
    client_max_body_size 15m;

    # 反向代理至 Sacred Focus 应用容器
    location / {
        proxy_pass http://sacred-focus:3000;
        proxy_http_version 1.1;

        # WebSocket 与持久连接支持
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # 透传真实客户端 IP 与强制 https scheme (保障 Secure Cookie 被浏览器采纳)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto https;

        # 超时时间加固
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
